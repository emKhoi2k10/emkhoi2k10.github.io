# Site Settings
title: "emKhoi2k10's blog"
subtitle: ""
description: ""
url: "https://emkhoi2k10.v1t.site"
baseurl: ""

# Theme
# theme: minimal-mistakes-jekyll
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "dark"

# Include
include:
  - _pages

# Build
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Plugins
plugins:
  - jekyll-include-cache

# Pagination
paginate: 10
paginate_path: /page:num/

# Author
author:
  name: "emKhoi2k10"
  avatar: # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio: "16 y.o CTF player and malware enthusiast"
  location: "45.240872, 37.262438"
  # fediverse      : "@you@instance.social"  # used for fediverse:creator meta tag
  links:
    - label: "emkhoi2k10@exploit.im"
      icon: "fa-brands fa-xmpp"
      url: "xmpp:emkhoi2k10@exploit.im"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
